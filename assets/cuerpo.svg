          d="M 167 84 L 142 92 C 134 95, 126 101, 122 109 L 119 118 L 134 122 L 144 106 L 152 98 L 167 94 Z" />
    <path id="front-hombro-der" class="body-zone zona-hombro" data-zone="Hombro" name="Hombro"
