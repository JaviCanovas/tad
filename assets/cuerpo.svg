    <path id="front-pie-izq" class="body-zone zona-pie" data-zone="Pie" name="Pie"
          d="M 147 452 L 138 464 C 135 469, 140 472, 150 472 L 165 472 L 165 452 Z" />
    <path id="front-pie-der" class="body-zone zona-pie" data-zone="Pie" name="Pie"
          d="M 203 452 L 212 464 C 215 469, 210 472, 200 472 L 185 472 L 185 452 Z" />
  </g>


  <!-- ========================================== -->
  <!-- VISTA POSTERIOR (Centro X = 525)           -->
  <!-- ========================================== -->
  <g id="vista-posterior" class="body-view">
