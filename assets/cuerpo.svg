<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="100%" height="100%" class="human-body-svg">
  <defs>
    <style>
      .view-label {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #64748b;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      .body-zone {
        fill: #e2e8f0;
        stroke: #94a3b8;
        stroke-width: 1.3;
        stroke-linejoin: round;
        stroke-linecap: round;
        transition: fill 0.25s ease, stroke 0.25s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .body-zone:hover {
        stroke: #0f172a;
        stroke-width: 2.5;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
      }
    </style>
  </defs>

  <!-- TITULOS DE LAS VISTAS -->
  <text x="175" y="22" class="view-label">VISTA FRONTAL</text>
  <text x="525" y="22" class="view-label">VISTA POSTERIOR</text>

  <!-- LINEA SEPARADORA SUTIL -->
  <line x1="350" y1="15" x2="350" y2="465" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ========================================== -->
  <!-- VISTA FRONTAL (Centro X = 175)             -->
  <!-- ========================================== -->
  <g id="vista-frontal" class="body-view">
    <!-- Cabeza -->
    <path id="front-cabeza" class="body-zone zona-cabeza" data-zone="Cabeza" name="Cabeza"
          d="M 160 48 C 160 38, 166 32, 175 32 C 184 32, 190 38, 190 48 C 190 57, 185 66, 182 76 L 181 84 L 169 84 L 168 76 C 165 66, 160 57, 160 48 Z" />

    <!-- Hombros (Izquierdo y Derecho) -->
