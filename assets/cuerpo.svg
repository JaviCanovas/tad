    <path id="back-muslo-der" class="body-zone zona-muslo" data-zone="Muslo" name="Muslo"
          d="M 563 223 L 562 255 C 561 280, 558 305, 556 330 L 532 330 C 528 305, 526 270, 525 236 L 552 234 Z" />

    <!-- Rodillas (Corva) Posterior -->
    <path id="back-rodilla-izq" class="body-zone zona-rodilla" data-zone="Rodilla" name="Rodilla"
          d="M 494 330 L 493 348 C 493 358, 495 365, 496 368 L 516 368 C 518 363, 519 353, 518 330 Z" />
    <path id="back-rodilla-der" class="body-zone zona-rodilla" data-zone="Rodilla" name="Rodilla"
