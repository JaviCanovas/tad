    <!-- Pantorrillas (Gemelos) Posterior -->
    <path id="back-pantorrilla-izq" class="body-zone zona-pantorrilla" data-zone="Pantorrilla" name="Pantorrilla"
          d="M 496 368 C 493 388, 493 410, 498 438 L 514 438 C 518 410, 517 388, 516 368 Z" />
    <path id="back-pantorrilla-der" class="body-zone zona-pantorrilla" data-zone="Pantorrilla" name="Pantorrilla"
          d="M 554 368 C 557 388, 557 410, 552 438 L 536 438 C 532 410, 533 388, 534 368 Z" />

    <!-- Tobillos (Tendón de Aquiles) Posterior -->
    <path id="back-tobillo-izq" class="body-zone zona-tobillo" data-zone="Tobillo" name="Tobillo"
          d="M 498 438 L 497 452 L 515 452 L 514 438 Z" />
    <path id="back-tobillo-der" class="body-zone zona-tobillo" data-zone="Tobillo" name="Tobillo"
